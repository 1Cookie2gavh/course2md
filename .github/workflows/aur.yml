name: aur

on:
  # release 由 GITHUB_TOKEN 创建，不会触发 release 事件（防递归），故用链式触发
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本（不带 v 前缀，如 0.4.0）"
        required: true

permissions:
  contents: read

jobs:
  update-aur:
    runs-on: ubuntu-latest
    container: archlinux:base
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')) }}
    steps:
      - name: Install tools
        run: |
          pacman -Sy --noconfirm git openssh make sudo
          id builder &>/dev/null || useradd -m builder

      - uses: actions/checkout@v4

      - name: Setup AUR SSH (builder)
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          install -dm700 -o builder -g builder /home/builder/.ssh
          printf '%s\n' "$AUR_KEY" > /home/builder/.ssh/aur_key
          chmod 600 /home/builder/.ssh/aur_key
          chown builder:builder /home/builder/.ssh/aur_key
          ssh-keyscan -t ed25519 aur.archlinux.org > /home/builder/.ssh/known_hosts 2>/dev/null || true
          chown builder:builder /home/builder/.ssh/known_hosts
          chmod +x packaging/aur/update-aur.sh

      - name: Update AUR package (as builder)
        env:
          VERSION: ${{ inputs.version || github.event.workflow_run.head_branch }}
        run: |
          su builder -s /bin/bash -c "
            export GIT_SSH_COMMAND='ssh -i /home/builder/.ssh/aur_key -o User=aur -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/home/builder/.ssh/known_hosts -o IdentitiesOnly=yes'
            export HOME=/home/builder
            packaging/aur/update-aur.sh '${VERSION#v}'
          "
