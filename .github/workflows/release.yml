name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: course2md-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: course2md-linux-aarch64
          # macOS arm64：macos-26（Xcode 27/Swift 6.4，与开发环境一致）
          - os: macos-26
            target: aarch64-apple-darwin
            asset: course2md-macos-arm64
          # x86_64 macOS 不编译 Apple 原生模块（build.rs 按 target_arch 跳过）
          - os: macos-26
            target: x86_64-apple-darwin
            asset: course2md-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: course2md-windows-x86_64.exe
            exe: true

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.exe != true
        run: |
          cp "target/${{ matrix.target }}/release/course2md" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"
          # macOS：ad-hoc 签名（ARM64 无签名二进制会被直接 SIGKILL）
          if [[ "$RUNNER_OS" == "macOS" ]]; then codesign --force --sign - "${{ matrix.asset }}"; fi

      - name: Package (windows)
        if: matrix.exe == true
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/course2md.exe" "${{ matrix.asset }}"

      # MLX Metal kernels（CoreML 推理运行时需要，与二进制同目录）
      - name: Collect mlx.metallib (macos arm64)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          if [ -f native/apple-asr/mlx.metallib ]; then
            cp native/apple-asr/mlx.metallib mlx-macos-arm64.metallib
          else
            src="$(find native/apple-asr/.build -name default.metallib | head -1)"
            test -n "$src"
            cp "$src" mlx-macos-arm64.metallib
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            mlx-macos-arm64.metallib

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
